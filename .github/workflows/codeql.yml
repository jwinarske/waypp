name: "CodeQL"

on:
  push:
    branches: [ 'v2.0' ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ 'main' ]
  schedule:
    - cron: '29 4 * * 4'

jobs:
  analyze:
    if: ${{ github.server_url == 'https://github.com' &&  always() }}
    name: Analyze
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'cpp' ]
        # CodeQL supports [ 'cpp', 'csharp', 'go', 'java', 'javascript', 'python', 'ruby' ]
        # Learn more about CodeQL language support at https://aka.ms/codeql-docs/language-support

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: 'true'

      - name: Install packages
        run: |
          echo ${{ github.server_url }}
          sudo apt-get -y install ninja-build \
          libwayland-dev wayland-protocols libxkbcommon-dev libglib2.0-dev \
          mesa-common-dev libegl1-mesa-dev libgles2-mesa-dev mesa-utils
          cmake --version
          gcc --version

      # Initializes the CodeQL tools for scanning.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@1b549b9259bda1cb5ddde3b41741a82a2d15a841 # v3.28.5
        with:
          languages: ${{ matrix.language }}
          # If you wish to specify custom queries, you can do so here or in a config file.
          # By default, queries listed here will override any specified in a config file.
          # Prefix the list here with "+" to use these queries and those in the config file.

          # Details on CodeQL's query packs refer to : https://docs.github.com/en/code-security/code-scanning/automatically-scanning-your-code-for-vulnerabilities-and-errors/configuring-code-scanning#using-queries-in-ql-packs
          queries: +security-and-quality

      - name: Configure
        run: |
          mkdir -p ${{github.workspace}}/build/release
          cmake -GNinja \
            -B ${{github.workspace}}/build/release \
            -D CMAKE_BUILD_TYPE=Release \
            -D CMAKE_STAGING_PREFIX=${{github.workspace}}/build/staging/usr/local \
            -D ENABLE_AGL_SHELL_CLIENT=ON \
            -D WAYPP_BUILD_EXAMPLES=ON \
            -D ENABLE_LTO=ON

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@1b549b9259bda1cb5ddde3b41741a82a2d15a841 # v3.28.5
        with:
          category: "/language:${{matrix.language}}"