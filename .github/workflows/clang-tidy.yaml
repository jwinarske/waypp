name: clang-tidy
permissions:
  contents: read

on:
  workflow_call:
    inputs:
      clang-version:
        description: "The version of Clang/LLVM to use"
        type: string
        required: false
        default: "18"
  pull_request:
    types: [ opened, synchronize, reopened, closed ]

jobs:
  tidy:
    runs-on: ubuntu-24.04

    env:
      CLANG_VERSION: ${{ inputs.clang-version || '18' }}

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: 'true'
          persist-credentials: false

      - name: Install Packages
        run: |
          sudo apt-get -y update
          sudo apt-get -y install ninja-build \
            libwayland-dev wayland-protocols libxkbcommon-dev libglib2.0-dev \
            mesa-common-dev libegl1-mesa-dev libgles2-mesa-dev mesa-utils
          cmake --version
          gcc --version

      - name: Install clang-tidy
        run: |
          # Disable man-db (massive speed-up!)
          sudo apt-get remove --purge man-db -yq
          # Install LLVM apt repo key
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          # Add LLVM apt repo — version resolved at job level via env.CLANG_VERSION
          RELEASE_NAME=$(lsb_release -sc 2>/dev/null || echo "noble")
          echo "deb https://apt.llvm.org/${RELEASE_NAME}/ llvm-toolchain-${RELEASE_NAME}-${CLANG_VERSION} main" \
            | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update -yq
          sudo apt-get install -yq "clang-tidy-${CLANG_VERSION}"

      - name: Configure CMake
        run: |
          cmake -G Ninja -B ${{ github.workspace }}/build \
            -D CMAKE_BUILD_TYPE=Release \
            -D ENABLE_AGL_SHELL_CLIENT=ON \
            -D WAYPP_BUILD_EXAMPLES=ON \
            -D ENABLE_LTO=ON \
            -D CMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build
        run: ninja -C ${{ github.workspace }}/build

      - name: clang-tidy
        working-directory: ${{ github.workspace }}
        run: |
          "clang-tidy-${CLANG_VERSION}" --dump-config
          ./scripts/run-clang-tidy.sh src      . ${{ github.workspace }}/build
          ./scripts/run-clang-tidy.sh examples . ${{ github.workspace }}/build
          ./scripts/run-clang-tidy.sh tests/csd . ${{ github.workspace }}/build

      - name: Show results
        if: always()
        run: |
          [ -f tidy-results-log.txt ]              && cat tidy-results-log.txt              || true
          [ -f tidy-results-suggested-fixes.txt ]  && cat tidy-results-suggested-fixes.txt  || true

      - name: Publish Report
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.1
        with:
          name: clang-tidy-results
          path: tidy-results-*