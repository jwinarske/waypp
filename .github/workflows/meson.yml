name: meson
permissions:
  contents: read

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            ninja-build pkg-config \
            libglib2.0-dev \
            libwayland-dev wayland-protocols \
            libxkbcommon-dev \
            mesa-common-dev libegl1-mesa-dev libgles2-mesa-dev \
            cmake libgtest-dev \
            libpugixml-dev
          pip install meson

      - name: Build and install wayland-cxx-scanner
        run: |
          git clone --depth=1 https://github.com/jwinarske/wayland-cxx-scanner \
            /tmp/wayland-cxx-scanner
          meson setup /tmp/wayland-cxx-scanner-build /tmp/wayland-cxx-scanner \
            --buildtype=release \
            --prefix=/usr/local
          ninja -C /tmp/wayland-cxx-scanner-build
          sudo --preserve-env=PATH ninja -C /tmp/wayland-cxx-scanner-build install

      - name: Build and install GoogleTest
        run: |
          cmake /usr/src/googletest \
            -B /tmp/gtest-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DINSTALL_GTEST=ON \
            -DBUILD_GMOCK=OFF
          cmake --build /tmp/gtest-build
          sudo cmake --install /tmp/gtest-build

      - name: Configure (default options + AGL shell + examples)
        run: |
          meson setup build \
            --buildtype=release \
            -Denable_agl_shell=true \
            -Dbuild_examples=true

      - name: Build
        run: ninja -C build

      - name: Configure (with tests)
        run: |
          meson setup build-tests \
            --buildtype=release \
            -Denable_agl_shell=true \
            -Dbuild_tests=true

      - name: Build (with tests)
        run: ninja -C build-tests

      - name: Test
        run: meson test -C build-tests --print-errorlogs
